<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table {
            width: 80%;
            margin: 40px auto;
            border: 4px double #222;
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
        }

        th {
            background:BLACK;
            color: white;
            padding: 15px;
            text-align: center;
            border-collapse: collapse;
        }

        td {
            text-align: center;
        }

        td,
        th {
            border: 1px solid black;
            padding: 10px;
        }

        .TOTAL {
            background-color: skyblue;
        }

        .GRADE {
            background-color: rgb(135, 235, 200);
        }
        .AVERAGE {
            background-color: rgb(215, 135, 235);
        }
    </style>
</head>

<body>
    <table border="n">
        <!-- TOP PART -->

</body>

</html>
