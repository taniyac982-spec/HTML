<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-card design</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: white;
        }
.card {
            width: 400px;
            padding: 15px;
            background-color: rgb(192, 255, 209);
            border-radius: 10px;
            box-shadow: 0px 10px 10px rgb(218, 215, 215);
            border-right: 2px solid rgb(148, 144, 144);
            border-bottom: 2px solid rgb(121, 119, 119);
        }
.card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
.card:hover h2 {
            color: rgb(94, 35, 204);
        }
.card h2::after {
            content: "👉 ";
            display: inline;
        }
.card:hover {
            margin-top: -5px;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="krishna.png" alt="Design">
        <h2>Radha Krishna</h2>
        <p><h5>A beautiful artwork inspired by the divine love of Radha and Krishna.
        </h5></p>
    </div>
</body>

</html>
