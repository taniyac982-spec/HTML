<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>




    <style>
        *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
    
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

        }
          .card {
            width: 350px;
            padding: 15px;
            background-color: rgb(208, 178, 139);
            border-radius: 10px;
            box-shadow: 0px 10px 10px rgb(218, 215, 215);
            transition: trasnform 0.3s ease;
        }
        .card:hover{
            transform: translateX(-10px);

        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .card content {
            padding: 15px;
        }

        
.card h3{
    margin-bottom: 10px;
    transition: color 0.3 ease;
}

.card:hover h3{
    color: blue;
}

.card p{
    color: rgb(66, 39, 4);
    line-height: 1.3;
    text-align: justify;
}


.card:hover p::after {
    content: " →";
    color: blue;
    font-size: 22px;
    
}

    </style>
</head>
<body>
    <div class="card">
        <img src="/8311eca3-d8b1-40c0-8251-abe7e20e95d5.png" alt="Krishna">
        <div class="card_content">
            <h3>
                My card
            </h3>

</p>
        </div>
    
    </div>


</body>
</html>
