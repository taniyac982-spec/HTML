<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Radha Krishna</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f8f8f5;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            padding: 60px;
        }

        .hero-content {
            padding: 20px;
        }

        .small-heading {
            font-size: 14px;
            letter-spacing: 3px;
            color: #28758a;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 50px;
            line-height: 1.2;
            color: #302c25;
            margin-bottom: 25px;
            font-family: "Playfair Display", serif;
        }

        .description {
            font-size: 18px;
            line-height: 1.6;
            color: #666;
            max-width: 550px;
            margin-bottom: 30px;
        }

        .button {
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            margin-right: 10px;
            box-shadow: 0px 10px 10px rgb(218, 215, 215);
        }

        .primary-btn {
            background-color: #28758a;
            color: white;
            border: 2px solid #28758a;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
            box-shadow: 0px 10px 10px rgb(218, 215, 215);
           }

        .primary-btn:hover {
            background-color: white;
            color: #28758a;
            border: 2px solid #28758a;
            box-shadow: 0px 10px 10px rgb(218, 215, 215);
        }

        .secondary-btn {
            background-color: white;
            color: #28758a;
            border: 2px solid #dbf7ff;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
            box-shadow: 0px 10px 10px rgb(218, 215, 215);
        }

        .secondary-btn:hover {
            background-color: #28758a;
            color: white;
            border: 2px solid #28758a;
            box-shadow: 0px 10px 10px rgb(218, 215, 215);
        }

        .hero-image img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 25px;
        }
    </style>
</head>

<body>
    <div class="hero">
        <div class="hero-content">
            <p class="small-heading">
                THE DIGITAL HOME OF SHRI RADHA KRISHNA
            </p>
            <h1>
                Experience the Divine
                <br>
                Love of Radha Krishna
            </h1>
            <p class="description">
                Explore their stories, teachings, sacred prayers,
                bhajans, temples, and timeless meaning across
                Hindu traditions.
            </p>
            <button class="primary-btn">
                Explore Radha Krishna
            </button>
            <button class="secondary-btn">
                Begin Daily Darshan
            </button>
        </div>
        <div class="hero-image">
<img src="./image.png" alt="Radha Krishna">
        </div>
    </div>
</body>

</html>
