<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grid Layout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            padding: 40px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 700px;
            height: 500px;
            margin: auto;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
            border-radius: 5px;
        }

        .box1 {
            grid-column: 1;
            grid-row: 1 / 4;
            background-color: lightblue;
        }

        .box2 {
            grid-column: 2 / 4;
            grid-row: 1;
            background-color: lightgreen;
        }

        .box3 {
            grid-column: 4;
            grid-row: 1;
            background-color: lightblue;
        }

        .box4 {
            grid-column: 2;
            grid-row: 2;
            background-color: lightgreen;
        }

        .box5 {
            grid-column: 3;
            grid-row: 2;
            background-color: lightblue;
        }

        .box6 {
            grid-column: 4;
            grid-row: 2 / 4;
            background-color: lightgreen;
        }

        .box7 {
            grid-column: 2;
            grid-row: 3;
            background-color: lightblue;
        }

        .box8 {
            grid-column: 3;
            grid-row: 3;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h2>Grid Layout</h2>

    <div class="grid-container">

        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
        <div class="box box6">6</div>
        <div class="box box7">7</div>
        <div class="box box8">8</div>

    </div>

</body>

</html>
