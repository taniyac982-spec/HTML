<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Media Query</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }


    header {
      background-color: black;
      color: white;
      padding: 20px;
      text-align: center;
    }



    nav {
      background-color: #333;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }


    .container {
      width: 90%;
      max-width: 1200px;
      margin: 30px auto;

      display: flex;
      gap: 20px;
    }



    .card {
      background-color: white;
      padding: 30px;
      flex: 1;
      text-align: center;
      border-radius: 10px;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    .card p {
      font-size: 16px;
    }

    /* -------------------------
           Tablet
           Screen <= 768px
        ------------------------- */

    @media (max-width: 768px) {

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 16px;
      }

      .container {
        flex-wrap: wrap;
      }

      .card {
        flex: 1 1 45%;
        background:red
      }
    }


    /* -------------------------
           Mobile
           Screen <= 600px
        ------------------------- */

    @media (max-width: 600px) {

      header {
        padding: 15px;
      }

      header h1 {
        font-size: 24px;
      }


      nav {
        flex-direction: column;
        align-items: center;
        gap: 10px;
        background:pink
      }

      nav a {
        font-size: 16px;
      }


      .container {
        width: 95%;
        flex-direction: column;
      }

      .card {
        width: 100%;
      }

      .card h2 {
        font-size: 22px;
      }

      .card p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>


  <header>
    <h1>My Website</h1>
  </header>


  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </nav>


  <div class="container">

    <div class="card">
      <h2>HTML</h2>
      <p>
        HTML is used to create the structure
        of a webpage.
      </p>
    </div>

    <div class="card">
      <h2>CSS</h2>
      <p>
        CSS is used to design and style
        a webpage.
      </p>
    </div>

    <div class="card">
      <h2>JavaScript</h2>
      <p>
        JavaScript is used to add functionality
        to a webpage.
      </p>
    </div>

  </div>

</body>

</html>
