<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From_1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to bottom,
                    #a9c0df,
                    #e56bb5);
        }

        .login_box {
            width: 350px;
            margin: 20px auto;
            padding: 35px 25px;
            background-color: white;
            border-radius: 25px;
            box-shadow: 0px 5px 20px gray;
            text-align: center;
        }

        .input_box {
            margin-bottom: 10px;
        }

        .input_box label {
            display: block;
            margin-bottom: 20px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #facfe7;
            border-radius: 20px;
            font-size: 9px;
        }

        label {
            display: block;
            color: #777777;
            margin-bottom: 8px;
        }


        .login-btn {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            border: none;
            border-radius: 20px;
            background-color: #cf83c1;
            color: white;
            font-size: 10px;
            cursor: pointer;
        }

        .bottom {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif italic;
            font-size: 10px;

        }

        .bottom input[type="checkbox"] {
            width: auto;
            padding: 0;
            margin-right: 5px;
        }

        .bottom a {
            color: #777777;
            font-family: Arial, Helvetica, sans-serif italic;
            font-style: italic;
            font-size: 10px;
            text-decoration: none;
        }
    </style>

</head>

<body>
    <div class="login_box">
        <form action="">
            <div class="input_box">
                <label for="Username"></label>
                <input type="text" placeholder="Username">
                <label for="Password"></label>
                <input type="password" placeholder="Password">
            </div>

            <button class="login-btn">
                LOG IN
            </button>

            <div class="bottom">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>
                <a href="">Forgot Password?</a>
            </div>
        </form>
    </div>
</body>

</html>
