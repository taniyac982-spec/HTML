<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Fillup</title>
    <style>
        * {
            ;
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background-color: rgb(240, 236, 236);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif #777777;
        }

        .login_box {
            width: 350px;
            margin: 20px auto;
            padding: 35px 25px;
            background-color: white;
            border-radius: 25px;
            box-shadow: 0px 5px 20px gray;
            text-align: center;
        }

        .login_box h2 {
            text-align: center;
            color: #23477d;
            font-size: 36px;
            margin-top: 90px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .input_box {
            margin-bottom: 10px;
        }

        .input_box label {
            display: block;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #777777;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #55a9dc;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-btn {
            width: 150px;
            padding: 10px;
            margin-top: 25px;
            background-color: #4da7dc;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 20px;
            font-weight: bold;
        }



        .forgot_signup {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            border: 20px;
        }

        .forgot_signup a {
            color: #55a9dc;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="login_box">
        <h2>LOGIN</h2>
        <form action="">
            <div class="input_box">
                <label for="USERNAME"></label>
                <input type="text" placeholder="USERNAME">
                <label for="PASSWORD"></label>
                <input type="password" placeholder="PASSWORD">
                <button class="login-btn">
                    LOG IN
                </button>
                <div class="forgot_signup">
                    <a href="">Forget password?</a>
                    <a href="">Sign Up</a>
                </div>
        </form>
    </div>
</body>

</html>
